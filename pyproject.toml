[project]
name = "hot-oam-dataset"
version = "0.2.0"
description = "Semantic segmentation dataset builder for building disaster mapping using HOT Tasking Manager and OpenAerialMap imagery"
readme = "README.md"
authors = [{ name = "kshitijrajsharma", email = "krschap@proton.me" }]
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "httpx>=0.27",
    "geomltoolkits>=2.0.2",
    "huggingface-hub>=0.25",
    "datasets>=3.0",
    "geopandas>=1.1.3",
]

[project.scripts]
hot-oam-dataset = "hot_oam_dataset.main:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "G",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "TID",
    "UP",
    "W",
]

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "pandas>=3.0.1",
    "pre-commit>=4.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
version_files = [
    "src/hot_oam_dataset/__init__.py:__version__",
]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
