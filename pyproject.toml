[project]
name = "hot-oam-dataset"
version = "0.1.0"
description = "Semantic segmentation dataset builder for building disaster mapping using HOT Tasking Manager and OpenAerialMap imagery"
readme = "README.md"
authors = [{ name = "kshitijrajsharma", email = "krschap@proton.me" }]
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "httpx>=0.27",
    "geomltoolkits>=2.0.2",
    "huggingface-hub>=0.25",
    "datasets>=3.0",
]

[project.scripts]
hot-oam-dataset = "hot_oam_dataset.main:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]
