[project]
site_name = "tm-oam-ds-builder"
site_url = "https://hotosm.github.io/tm-oam-ds-builder/"
site_description = "Training datasets from HOT Tasking Manager projects, OpenAerialMap imagery and OpenStreetMap labels."
site_author = "Humanitarian OpenStreetMap Team"
copyright = "Copyright &copy; 2026 Humanitarian OpenStreetMap Team"

repo_url = "https://github.com/hotosm/tm-oam-ds-builder"
repo_name = "hotosm/tm-oam-ds-builder"
edit_uri = "edit/master/docs/"

nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    { "Load a dataset" = "guides/load-a-dataset.md" },
    { "Make your own split" = "guides/own-split.md" },
    { "Browse with STAC Browser" = "guides/stac-browser.md" },
    { "Inspect in QGIS" = "guides/qgis.md" },
    { "Build a dataset" = "guides/build-a-dataset.md" },
  ] },
  { "Reference" = "reference.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/hotosm/tm-oam-ds-builder"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
